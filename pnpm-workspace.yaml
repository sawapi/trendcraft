packages:
  - "packages/*"
  - "packages/chart/examples/strategy-studio"

# Supply chain security: delay installing newly published versions.
# 4320 minutes = 3 days. Blocks packages published less than 3 days ago,
# giving time for compromised releases to be reported and yanked (npm's own
# unpublish window is 72 hours; Renovate's npm default is also 3 days). A
# longer wait also delays security fixes: for an urgent one, exempt that
# package with minimumReleaseAgeExclude rather than holding a vulnerable version.
# The examples install with --ignore-workspace, so each carries its own copy
# in packages/*/examples/*/.npmrc; keep them in step.
minimumReleaseAge: 4320

overrides:
  # GHSA-r5fr-rjxr-66jc / GHSA-f23m-r3pf-42rh: lodash <= 4.17.23 is vulnerable.
  # Pulled in transitively (build-time only) via vite-plugin-dts -> @microsoft/api-extractor.
  lodash: ^4.18.0
  # The root devDependency pins @types/node to the oldest supported Node major
  # (engines.node >=22); that alone is what the typecheck reads. This override
  # only keeps a second copy out of the lockfile: pnpm 10 picks the
  # auto-installed optional @types/node peer of vite / vitest / api-extractor
  # from the newest version in the graph, ignoring the workspace root's range.
  # pnpm 11.18+ fixes that, so drop this entry after moving to it. Bump
  # together with engines.node and the root devDependency.
  "@types/node": ^22.20.5
  # Advisories in transitive dev/build dependencies that the parents' own
  # ranges still allow (Dependabot cannot bump these). Drop an entry once its
  # parent requires a fixed version.
  # ajv / minimatch: via vite-plugin-dts -> @microsoft/api-extractor. Overrides
  # apply to this workspace only: they do not change what a published
  # package's users install (ajv is also an @modelcontextprotocol/sdk dependency).
  ajv@>=7.0.0 <8.18.0: ^8.18.0
  minimatch@>=10.0.0 <10.2.3: ^10.2.3
