packages:
  - "packages/*"
  - "packages/chart/examples/strategy-studio"

# Supply chain security: delay installing newly published versions.
# 10080 minutes = 7 days. Blocks packages published less than 7 days ago,
# giving time for compromised releases to be reported and yanked.
minimumReleaseAge: 10080

overrides:
  # GHSA-r5fr-rjxr-66jc / GHSA-f23m-r3pf-42rh: lodash <= 4.17.23 is vulnerable.
  # Pulled in transitively (build-time only) via vite-plugin-dts -> @microsoft/api-extractor.
  lodash: ^4.18.0
  # Advisories in transitive dev/build dependencies that the parents' own
  # ranges still allow (Dependabot cannot bump these). Drop an entry once its
  # parent requires a fixed version.
  # ajv / minimatch: via vite-plugin-dts -> @microsoft/api-extractor. Overrides
  # apply to this workspace only: they do not change what a published
  # package's users install (ajv is also an @modelcontextprotocol/sdk dependency).
  ajv@>=7.0.0 <8.18.0: ^8.18.0
  minimatch@>=10.0.0 <10.2.3: ^10.2.3
  # Temporary: hold happy-dom at main's version. Every 20.x is affected by
  # GHSA-834v-8h66-3h79 and the fix (21.0.4, a major) is not yet past
  # minimumReleaseAge; moving within 20.x would only re-introduce the alert.
  # Replace with happy-dom ^21.0.4 in packages/chart once it is installable.
  happy-dom: 20.9.0
  # Temporary: hold express and body-parser (via @modelcontextprotocol/sdk) at
  # main's versions. body-parser 2.0.0 - 2.3.x are affected by
  # GHSA-27r3-jxmh-p828 and the fix (2.4.0) is not yet past minimumReleaseAge;
  # moving within the affected range would only re-introduce the alert, and
  # express 5.3.0 requires body-parser ^2.3.0, so express stays at 5.2.1
  # (which accepts 2.2.2). Drop both once body-parser 2.4.0 is installable.
  express: 5.2.1
  body-parser: 2.2.2
  # Temporary: hold fast-uri (via ajv) at main's version. Everything below
  # 3.1.9 is affected by GHSA-w74x-v6f9-j3xg / GHSA-wjr9-j795-jxcr and 3.1.9
  # is not yet past minimumReleaseAge. Drop once it is installable.
  fast-uri: 3.1.0
