name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24, 26]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm build

      # After build: chart/mcp type-check against `trendcraft`'s published
      # types (packages/core/dist/*.d.ts), which only exist post-build.
      - run: pnpm typecheck

      - run: pnpm test

  primary:
    # Checks that run once, on the project's primary Node from .node-version,
    # rather than on every matrix leg.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - name: Cross-validation (TA-Lib compatibility)
        run: cd packages/core && pnpm test:crossval

      - name: Bundle size check (core)
        run: cd packages/core && pnpm exec size-limit

      - name: Bundle size check (chart)
        run: cd packages/chart && pnpm size-check

      - name: Build chart examples
        # Each example installs with `pnpm install --ignore-workspace`, which
        # skips pnpm-workspace.yaml entirely. Previous fix attempts (pnpm
        # field in each package.json, .npmrc in each example, uppercase
        # NPM_CONFIG env var) all proved ineffective against pnpm 10.33's
        # strict-dep-builds enforcement on GH Actions runners.
        #
        # Use the lowercase env var form that pnpm docs actually prescribe
        # AND write to the pnpm global config as a prep step — global config
        # is read even under --ignore-workspace. Keep strict enabled so a
        # new postinstall-bearing package in an example still fails CI.
        env:
          npm_config_only_built_dependencies: esbuild
        run: |
          pnpm config set --global --json onlyBuiltDependencies '["esbuild"]'
          cd packages/chart/examples/simple-chart && pnpm install --ignore-workspace && pnpm build
          cd ../simple-react-chart && pnpm install --ignore-workspace && pnpm build
          cd ../simple-vue-chart && pnpm install --ignore-workspace && pnpm build
          cd ../indicator-showcase && pnpm install --ignore-workspace && pnpm build

  e2e:
    # Browser tests for @trendcraft/chart (packages/chart/e2e): canvas
    # painting and real wheel / mouse / touch input, which happy-dom cannot
    # exercise.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The fixture imports chart source, which resolves `trendcraft` from
      # its built dist.
      - run: pnpm --filter trendcraft build

      - run: cd packages/chart && pnpm exec playwright install --with-deps chromium

      - run: cd packages/chart && pnpm test:e2e

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-traces
          path: packages/chart/test-results/
          retention-days: 7
