<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>@trendcraft/chart — Simple Chart</title>
  <script>
    // Apply the initial theme before first paint
    document.documentElement.dataset.theme = window.matchMedia("(prefers-color-scheme: light)").matches
      ? "light"
      : "dark";
  </script>
  <style>
    :root[data-theme="dark"] {
      --bg: #0a0e17;
      --surface: #131722;
      --surface-2: #1e222d;
      --border: #2a2e39;
      --text: #d1d4dc;
      --text-muted: #787b86;
      --accent: #2196F3;
      --accent-text: #fff;
    }
    :root[data-theme="light"] {
      --bg: #f5f5f5;
      --surface: #ffffff;
      --surface-2: #f0f3fa;
      --border: #e0e3eb;
      --text: #131722;
      --text-muted: #6a6d78;
      --accent: #2196F3;
      --accent-text: #fff;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    header {
      padding: 8px 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }
    h1 { font-size: 14px; font-weight: 600; white-space: nowrap; }
    .controls { display: flex; gap: 4px; flex-wrap: wrap; margin-left: auto; }
    /* Scoped to the toolbar: the chart's legend has buttons of its own */
    .controls button {
      padding: 4px 8px;
      font-size: 11px;
      background: var(--surface-2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 4px;
      cursor: pointer;
      white-space: nowrap;
    }
    .controls button:hover { background: var(--border); }
    .controls button[aria-pressed="true"] { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
    #chart { flex: 1; min-height: 0; }
    @media (max-width: 600px) {
      .controls { margin-left: 0; width: 100%; }
      .controls button { padding: 6px 10px; font-size: 12px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Simple Chart</h1>
    <div class="controls">
      <button type="button" data-indicator="sma" aria-pressed="true">SMA 50</button>
      <button type="button" data-indicator="bb" aria-pressed="false">Bollinger</button>
      <button type="button" data-indicator="rsi" aria-pressed="true">RSI 14</button>
      <button type="button" data-indicator="macd" aria-pressed="false">MACD</button>
      <button type="button" id="btn-backtest" aria-pressed="false">Backtest: SMA 5/25 cross</button>
      <button type="button" id="btn-theme">Theme: Dark</button>
    </div>
  </header>
  <div id="chart"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
