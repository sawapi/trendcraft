<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Indicator Showcase — @trendcraft/chart</title>
    <script>
      // Apply the initial theme before first paint (main.ts reads it back for the chart).
      document.documentElement.dataset.theme = window.matchMedia("(prefers-color-scheme: light)")
        .matches
        ? "light"
        : "dark";
    </script>
    <style>
      :root[data-theme="dark"] {
        color-scheme: dark;
        --bg: #131722;
        --surface: #1e222d;
        --surface-2: #2a2e39;
        --border: #2a2e39;
        --text: #d1d4dc;
        --text-muted: #787b86;
        --accent: #2196f3;
        --accent-text: #ffffff;
        --up: #26a69a;
        --down: #ef5350;
      }
      :root[data-theme="light"] {
        color-scheme: light;
        --bg: #ffffff;
        --surface: #f4f5f7;
        --surface-2: #e6e8ec;
        --border: #d5d8de;
        --text: #131722;
        --text-muted: #5f6370;
        --accent: #1e88e5;
        --accent-text: #ffffff;
        --up: #26a69a;
        --down: #e53935;
      }

      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { height: 100%; overflow: hidden; background: var(--bg); color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }

      .app { display: flex; flex-direction: column; height: 100vh; }

      /* Toolbar */
      .toolbar {
        display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px;
        padding: 8px 16px; background: var(--surface); border-bottom: 1px solid var(--border);
        flex-shrink: 0; z-index: 10;
      }
      /* Buttons sit on the right and wrap onto further rows when space runs out */
      .toolbar-actions {
        display: flex; flex-wrap: wrap; gap: 6px 8px; justify-content: flex-end;
        margin-left: auto; min-width: 0;
      }
      .toolbar-title {
        font-size: 14px; font-weight: 700; color: var(--text); white-space: nowrap;
      }
      .toolbar-tag {
        font-size: 10px; padding: 2px 8px; border-radius: 10px;
        background: var(--accent); color: var(--accent-text); white-space: nowrap;
      }
      .toolbar-btn {
        padding: 5px 12px; font-size: 12px; background: var(--surface-2);
        border: 1px solid var(--border); border-radius: 4px; color: var(--text);
        cursor: pointer; white-space: nowrap;
      }
      .toolbar-btn:hover { border-color: var(--accent); }
      #btn-menu { display: none; font-size: 18px; line-height: 1; }

      /* Main layout */
      .main { display: flex; flex: 1; overflow: hidden; }

      /* Sidebar */
      #sidebar {
        width: 280px; flex-shrink: 0; border-right: 1px solid var(--border);
        display: flex; flex-direction: column; overflow: hidden;
      }

      /* Chart */
      #chart { flex: 1; min-width: 0; }

      /* Responsive */
      @media (max-width: 767px) {
        #btn-menu { display: block; }
        .toolbar { padding: 8px 12px; }
        /* Full-width second row so every button stays reachable on a phone */
        .toolbar-actions { flex-basis: 100%; justify-content: flex-start; margin-left: 0; }
        .toolbar-btn { padding: 5px 9px; }
        /* Drawer opens below the toolbar (height set by main.ts) so ☰ stays clickable */
        #sidebar {
          position: fixed; top: var(--toolbar-h, 0px); left: 0; bottom: 0;
          width: min(300px, 85vw);
          z-index: 100; transform: translateX(-100%);
          transition: transform 0.25s ease;
          box-shadow: none;
        }
        #sidebar.open {
          transform: translateX(0);
          box-shadow: 4px 0 20px rgba(0,0,0,0.5);
        }
      }

      /* Scrollbar styling */
      ::-webkit-scrollbar { width: 6px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: var(--surface-2); border-radius: 3px; }
      ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }
    </style>
  </head>
  <body>
    <div class="app">
      <div class="toolbar">
        <button class="toolbar-btn" id="btn-menu">&#9776;</button>
        <span class="toolbar-title">@trendcraft/chart</span>
        <span class="toolbar-tag">Indicator Showcase</span>
        <div class="toolbar-actions">
          <button class="toolbar-btn" id="btn-timeframe">Timeframe: Daily</button>
          <button class="toolbar-btn" id="btn-type">Chart: Candle</button>
          <button class="toolbar-btn" id="btn-fit">Fit</button>
          <button class="toolbar-btn" id="btn-badges">Badges: off</button>
          <button class="toolbar-btn" id="btn-badge-mode">Mode: absolute</button>
          <button class="toolbar-btn" id="btn-export">Export PNG</button>
          <button class="toolbar-btn" id="btn-theme">Theme: Dark</button>
        </div>
      </div>
      <div class="main">
        <div id="sidebar"></div>
        <div id="chart"></div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
