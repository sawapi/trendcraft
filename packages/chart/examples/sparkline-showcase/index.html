<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>@trendcraft/chart — Sparkline Showcase</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0a0e17;
      color: #d1d4dc;
    }
    header {
      padding: 12px 16px;
      border-bottom: 1px solid #1f2937;
      display: flex;
      gap: 16px;
      align-items: center;
      flex-wrap: wrap;
    }
    h1 { font-size: 14px; font-weight: 600; }
    .controls { display: flex; gap: 12px; font-size: 12px; align-items: center; }
    select, button {
      background: #1f2937;
      color: #d1d4dc;
      border: 1px solid #374151;
      border-radius: 4px;
      padding: 4px 8px;
      font-size: 12px;
    }
    main {
      max-width: 480px;
      padding: 12px 16px;
    }
    .group {
      margin-bottom: 24px;
    }
    .group-header {
      font-size: 12px;
      color: #9ca3af;
      padding-bottom: 6px;
      border-bottom: 1px solid #1f2937;
      margin-bottom: 4px;
    }
    .row {
      display: grid;
      grid-template-columns: 60px 1fr 80px 90px;
      gap: 8px;
      align-items: center;
      padding: 6px 0;
      border-bottom: 1px solid #111827;
      font-size: 13px;
    }
    .symbol { color: #60a5fa; font-weight: 600; }
    .name { color: #9ca3af; font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .price { text-align: right; font-variant-numeric: tabular-nums; }
    .change { text-align: right; font-variant-numeric: tabular-nums; font-size: 11px; }
    .up { color: #16a34a; }
    .down { color: #dc2626; }
    .spark { display: block; }
    .stats {
      font-size: 11px;
      color: #9ca3af;
      padding: 8px 16px;
      border-top: 1px solid #1f2937;
    }
  </style>
</head>
<body>
  <header>
    <h1>@trendcraft/chart — Sparkline Showcase</h1>
    <div class="controls">
      <label>
        Mode:
        <select id="mode">
          <option value="line">Line + fill</option>
          <option value="candle">Candle</option>
        </select>
      </label>
      <label>
        Color:
        <select id="color">
          <option value="auto">auto (default)</option>
          <option value="period">period (single color)</option>
          <option value="baseline">baseline (=100)</option>
          <option value="fixed">fixed (#60a5fa)</option>
        </select>
      </label>
      <label>
        Count:
        <select id="count">
          <option>50</option>
          <option selected>200</option>
          <option>500</option>
        </select>
      </label>
      <label>
        Session:
        <select id="session">
          <option value="full">Full (data fills width)</option>
          <option value="mid">Mid-session (totalSlots, ≈40%)</option>
          <option value="late">Late-session (totalSlots, ≈80%)</option>
          <option value="jpx">JPX session w/ lunch break (time-based)</option>
        </select>
      </label>
      <button id="regen">Regenerate</button>
    </div>
  </header>
  <main id="root"></main>
  <div class="stats" id="stats">…</div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
